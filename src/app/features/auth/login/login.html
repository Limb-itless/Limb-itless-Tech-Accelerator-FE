<section class="login">
  <h1>Sign in</h1>

  <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <div class="login__field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="isInvalid('email') ? 'true' : null"
        [attr.aria-describedby]="isInvalid('email') ? 'login-email-error' : null"
      />
      @if (isInvalid('email')) {
        <p id="login-email-error" class="login__hint">Enter a valid email address.</p>
      }
    </div>

    <div class="login__field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="isInvalid('password') ? 'true' : null"
        [attr.aria-describedby]="isInvalid('password') ? 'login-password-error' : null"
      />
      @if (isInvalid('password')) {
        <p id="login-password-error" class="login__hint">Enter your password.</p>
      }
    </div>

    <button type="submit" class="login__submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="login__footer">Patient? <a routerLink="/register">Create an account</a></p>
</section>
