<div class="app-shell">
  <header class="app-header">
    <span class="app-header__brand">LimbItless</span>

    <nav class="app-header__nav" aria-label="Primary">
      @for (link of navLinks(); track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active">{{ link.label }}</a>
      }
    </nav>

    @if (user(); as currentUser) {
      <div class="app-header__user">
        <span class="app-header__identity">
          <span class="app-header__email">{{ currentUser.email }}</span>
          <span class="app-header__context">
            {{ roleLabel() }}
            @if (currentUser.practiceName) {
              <span aria-hidden="true"> · </span>{{ currentUser.practiceName }}
            }
            @if (currentUser.siteName) {
              <span aria-hidden="true"> · </span>{{ currentUser.siteName }}
            }
          </span>
        </span>
        <button type="button" class="app-header__signout" (click)="signOut()">Sign out</button>
      </div>
    }
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
